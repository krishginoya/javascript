<html>

<head>
    <title>Bitwise opration</title>
</head>

<body>
    <h2>Bitwise opration</h2>

    <p id="demo"></p>
    <p id="demo2"></p>
    <p id="demo3"></p>
    <script>
        let a = 3;
        let b = 5;

        //and
        document.getElementById("demo").innerHTML = "a & b" + (a & b);

        //or
        document.getElementById("demo2").innerHTML = "a | b" + (a | b);

        //xnor
        document.getElementById("demo3").innerHTML = "a ^ b" + (a ^ b);

    </script>
</body>

</html>

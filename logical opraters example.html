<html>

<head>
    <title>logical opreter</title>
</head>

<body>
    <h2>logical opraters example</h2>

    <p id="demo"></p>
    <p id="demo2"></p>
    <p id="demo3"></p>
    <script>
        let a = true;
        let b = false;

        //and
        document.getElementById("demo").innerHTML = "a && b" + (a && b);

        //or
        document.getElementById("demo2").innerHTML = "a || b" + (a || b);

        //not
        document.getElementById("demo3").innerHTML = "!a=" + (!a);
    </script>
</body>

</html>

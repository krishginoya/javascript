<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="Marksheet.css">
    <title> Marksheet</title>
</head>
<body>
    <div class="marksheet-form">
        <h2>  Noble Marksheet</h2>
        <form id="marksForm" action="marksheet-1.html" method="GET">
            <div class="form-group">
                <label for="name">Student Name:</label>
                <input type="text" id="name" name="name" required>
            </div>
            
            <div class="form-group">
                <label for="English">English:</label>
                <input type="number" id="English" name="English" min="0" max="100" required>
            </div>
            
            <div class="form-group">
                <label for="Economics">Economics:</label>
                <input type="number" id="Economics" name="Economics" min="0" max="100" required>
            </div>
            
            <div class="form-group">
                <label for="Commerce">Commerce:</label>
                <input type="number" id="Commerce" name="Commerce" min="0" max="100" required>
            </div>
            
            <div class="form-group">
                <label for="Accountancy">Accountancy:</label>
                <input type="number" id="Accountancy" name="Accountancy" min="0" max="100" required>
            </div>
            
            <div class="form-group">
                <label for="Business Studies">Business Studies:</label>
                <input type="number" id="Business Studies" name="Business Studies" min="0" max="100" required>
            </div>
            
            <button type="submit" class="enter-btn">Enter</button>
        </form>
    </div>
</body>
</html>
